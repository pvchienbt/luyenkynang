        function vietnameseToTelex(text) {
            const map = { 'à': 'af', 'á': 'as', 'ả': 'ar', 'ã': 'ax', 'ạ': 'aj', 'â': 'aa', 'ầ': 'aaf', 'ấ': 'aas', 'ẩ': 'aar', 'ẫ': 'aax', 'ậ': 'aaj', 'ă': 'aw', 'ằ': 'awf', 'ắ': 'aws', 'ẳ': 'awr', 'ẵ': 'awx', 'ặ': 'awj', 'è': 'ef', 'é': 'es', 'ẻ': 'er', 'ẽ': 'ex', 'ẹ': 'ej', 'ê': 'ee', 'ề': 'eef', 'ế': 'ees', 'ể': 'eer', 'ễ': 'eex', 'ệ': 'eej', 'ì': 'if', 'í': 'is', 'ỉ': 'ir', 'ĩ': 'ix', 'ị': 'ij', 'ò': 'of', 'ó': 'os', 'ỏ': 'or', 'õ': 'ox', 'ọ': 'oj', 'ô': 'oo', 'ồ': 'oof', 'ố': 'oos', 'ổ': 'oor', 'ỗ': 'oox', 'ộ': 'ooj', 'ơ': 'ow', 'ờ': 'owf', 'ớ': 'ows', 'ở': 'owr', 'ỡ': 'owx', 'ợ': 'owj', 'ù': 'uf', 'ú': 'us', 'ủ': 'ur', 'ũ': 'ux', 'ụ': 'uj', 'ư': 'uw', 'ừ': 'uwf', 'ứ': 'uws', 'ử': 'uwr', 'ữ': 'uwx', 'ự': 'uwj', 'ỳ': 'yf', 'ý': 'ys', 'ỷ': 'yr', 'ỹ': 'yx', 'ỵ': 'yj', 'đ': 'dd' };

            for (let [vn, telex] of Object.entries(map)) { res = res.replace(new RegExp(vn, 'g'), telex); }

        // --- AUDIO ENGINE v32.0 ---
        let audioCtx = null;
        let ditBuffer = null;
        let dahBuffer = null;

        async function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            const loadFile = async (name) => {
                try {
                    const response = await fetch(encodeURIComponent(name));
                    if (!response.ok) return null;
                    return await audioCtx.decodeAudioData(await response.arrayBuffer());
                } catch (e) { return null; }
            };

            if (!ditBuffer) ditBuffer = await loadFile(ditFile);
            if (!dahBuffer) dahBuffer = await loadFile(dahFile);
        }

        function playWhistle(isDit, duration, startTime) {
            const buffer = isDit ? ditBuffer : dahBuffer;
            if (buffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(1.0, startTime + 0.005);
                gain.gain.setValueAtTime(1.0, startTime + duration - 0.005);
                gain.gain.linearRampToValueAtTime(0, startTime + duration);
                source.connect(gain);
                gain.connect(audioCtx.destination);
                source.start(startTime);
                source.stop(startTime + duration);
            } else {
                // STEEL SYNTH v32 (Dự phòng trong vắt)
                const merger = audioCtx.createChannelMerger(2);
                const masterGain = audioCtx.createGain();
                const delay = audioCtx.createDelay();
                delay.delayTime.value = 0.003; 

                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(isDit ? 35 : 12, startTime); 
                lfoGain.gain.setValueAtTime(isDit ? 12 : 2, startTime); 
                lfo.connect(lfoGain);

                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                osc1.type = 'sine'; osc2.type = 'triangle';
                const baseFreq = 3000; 
                osc1.frequency.setValueAtTime(baseFreq, startTime);
                osc2.frequency.setValueAtTime(baseFreq + 5, startTime);
                lfoGain.connect(osc1.frequency); lfoGain.connect(osc2.frequency);

                const noise = audioCtx.createBufferSource();
                const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
                const data = buf.getChannelData(0);
                for(let i=0; i<buf.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buf; noise.loop = true;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(baseFreq, startTime);
                noiseFilter.Q.setValueAtTime(30, startTime);

                const attackTime = 0.005; 
                masterGain.gain.setValueAtTime(0, startTime);
                masterGain.gain.linearRampToValueAtTime(0.7, startTime + attackTime);
                masterGain.gain.setValueAtTime(0.7, startTime + duration - 0.01);
                masterGain.gain.linearRampToValueAtTime(0, startTime + duration); 

                osc1.connect(masterGain); osc2.connect(masterGain);
                noise.connect(noiseFilter); noiseFilter.connect(masterGain);
                masterGain.connect(merger, 0, 0);
                masterGain.connect(delay); delay.connect(merger, 0, 1);
                merger.connect(audioCtx.destination);

                osc1.start(startTime); osc2.start(startTime); noise.start(startTime); lfo.start(startTime);
                osc1.stop(startTime + duration); osc2.stop(startTime + duration); noise.stop(startTime + duration); lfo.stop(startTime + duration);
            }
        }

        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                return await response.json();
            } catch (error) {
                if (retries > 0) { await new Promise(r => setTimeout(r, backoff)); return fetchWithRetry(url, options, retries-1, backoff*2); }
                throw error;
            }
        }

        async function generateAIContent(target) {
            const modeId = (target === 'morse') ? 'morse' : 'sema';
            const numWordsReq = parseInt(document.getElementById(`ai-words-${modeId}`).value);
            const numNumsReq = parseInt(document.getElementById(`ai-nums-${modeId}`).value);
            const loadingEl = document.getElementById(`${modeId}-loading`);
            const inputEl = document.getElementById(`${modeId}-input`);
            const btnEl = document.getElementById(`gen-ai-btn-${modeId}`);
            
            loadingEl.classList.remove('hidden'); btnEl.disabled = true;

            const sys = `Bạn là Huấn luyện viên Kim Đồng. Soạn bản tin truyền tin Đội. QUY TẮC: 1. ĐÚNG ${numWordsReq} từ. 2. ĐÚNG ${numNumsReq} số. 3. Văn bản chuẩn tiếng Việt.`;
            try {
                if (!apiKey) throw new Error("API Key bị thiếu.");

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const data = await fetchWithRetry(url, { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Soạn tin đúng ${numWordsReq} từ, có ${numNumsReq} số.` }] }], systemInstruction: { parts: [{ text: sys }] } }) 
                });
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "SẴN SÀNG!";
                let wordsArr = text.split(/\s+/).filter(w => w.length > 0);
                if (wordsArr.length !== numWordsReq) {
                    if (wordsArr.length > numWordsReq) text = wordsArr.slice(0, numWordsReq).join(' ');
                    else while(wordsArr.length < numWordsReq) wordsArr.push("ĐỘI"); text = wordsArr.join(' ');
                }
                inputEl.value = text;
                if (practiceActive[target === 'morse' ? 'morse' : 'semaphore']) document.getElementById(`${modeId}-answer-box`).classList.remove('hidden');
            } catch (e) { 
                inputEl.value = "LỖI AI: Vui lòng kiểm tra kết nối mạng hoặc API Key.\n\n" + e.message; 
            } finally { 
                loadingEl.classList.add('hidden'); btnEl.disabled = false; 
            }
        }

        let isMorsePlaying = false;
        async function playMorse() {
            if (isMorsePlaying) return;
            isMorsePlaying = true;
            document.getElementById('btn-play-morse').disabled = true;
            await initAudio(); 
            const text = vietnameseToTelex(document.getElementById('morse-input').value);
            const wpm = parseInt(document.getElementById('morse-wpm').value);
            const dot = 1.5 / wpm; 
            let scheduleTime = audioCtx.currentTime + 0.1;

            const displayQueue = [];
            const pulseQueue = [];

            pulseQueue.push({ start: scheduleTime, end: scheduleTime + (dot * 8), char: '!!!', code: '' });
            playWhistle(false, dot * 8, scheduleTime);
            scheduleTime += (dot * 8) + (dot * 5);

            for (let char of text) {
                if (!isMorsePlaying) break;
                if (char === ' ') { 
                    displayQueue.push({ time: scheduleTime, char: '␣', code: '' });
                    scheduleTime += dot * 7; continue; 
                }
                const code = morseData[char] || '';
                displayQueue.push({ time: scheduleTime, char: practiceActive.morse ? '?' : char, code: practiceActive.morse ? '***' : code });
                for (let i = 0; i < code.length; i++) {
                    const isDit = (code[i] === '.');
                    const duration = isDit ? dot : dot * 3;
                    playWhistle(isDit, duration, scheduleTime);
                    pulseQueue.push({ start: scheduleTime, end: scheduleTime + duration });
                    scheduleTime += duration + (dot * 1.0); 
                }
                scheduleTime += (dot * 3.0) - (dot * 1.0); 
            }

            const arCode = ".-.-.";
            displayQueue.push({ time: scheduleTime, char: 'AR', code: '.-.-.' });
            for (let i = 0; i < arCode.length; i++) {
                const isDit = (arCode[i] === '.');
                const duration = isDit ? dot : dot * 3;
                playWhistle(isDit, duration, scheduleTime);
                pulseQueue.push({ start: scheduleTime, end: scheduleTime + duration });
                scheduleTime += duration + (dot * 1.0);
            }

            const monitor = setInterval(() => {
                const now = audioCtx.currentTime;
                if (displayQueue.length > 0 && now >= displayQueue[0].time) {
                    const item = displayQueue.shift();
                    document.getElementById('morse-char-current').innerText = item.char;
                    document.getElementById('morse-output').innerText = item.code;
                }
                let activePulse = pulseQueue.find(p => now >= p.start && now <= p.end);
                if (activePulse) {
                    document.getElementById('visual-signal').classList.add('signal-on');
                    document.getElementById('signal-glow').style.opacity = "1";
                } else {
                    document.getElementById('visual-signal').classList.remove('signal-on');
                    document.getElementById('signal-glow').style.opacity = "0";
                }
                if (now > scheduleTime || !isMorsePlaying) { clearInterval(monitor); stopMorse(); }
            }, 20);
        }
        function stopMorse() { isMorsePlaying = false; document.getElementById('btn-play-morse').disabled = false; document.getElementById('morse-char-current').innerText = ''; document.getElementById('morse-output').innerText = ''; }

        let isSemaPlaying = false; let semaTimer = null;
        async function playSemaphore() {
            if (isSemaPlaying) return;
            isSemaPlaying = true;
            document.getElementById('btn-play-sema').disabled = true;
            const text = vietnameseToTelex(document.getElementById('sema-input').value);
            const speed = parseInt(document.getElementById('sema-speed').value);
            const modeTag = document.getElementById('mode-tag');
            let isNumericMode = false;
            let lastChar = null;

            updateSemaFlags('ATT', false);
            document.getElementById('arm-left-screen').classList.add('animate-wave-l');
            document.getElementById('arm-right-screen').classList.add('animate-wave-r');
            await new Promise(r => semaTimer = setTimeout(r, 2500));
            document.getElementById('arm-left-screen').classList.remove('animate-wave-l');
            document.getElementById('arm-right-screen').classList.remove('animate-wave-r');

            for (let char of text) {
                if (!isSemaPlaying) break;
                if (char === lastChar && char !== ' ') {
                    updateSemaFlags('REST', false);
                    await new Promise(r => semaTimer = setTimeout(r, speed * 0.4));
                }
                if (char === ' ') { 
                    if (isNumericMode) { isNumericMode = false; modeTag.classList.add('hidden'); updateSemaFlags('ALPHA'); await new Promise(r => semaTimer = setTimeout(r, speed * 1.5)); } 
                    updateSemaFlags('REST'); await new Promise(r => semaTimer = setTimeout(r, speed * 2)); continue; 
                }
                if (/[0-9]/.test(char)) { 
                    if (!isNumericMode) { updateSemaFlags('NUM'); modeTag.innerText = "CHẾ ĐỘ SỐ"; modeTag.classList.remove('hidden'); await new Promise(r => semaTimer = setTimeout(r, speed * 1.5)); isNumericMode = true; } 
                    updateSemaFlags(digitToLetter[char], true, char); await new Promise(r => semaTimer = setTimeout(r, speed)); 
                } else { 
                    if (isNumericMode) { isNumericMode = false; modeTag.classList.add('hidden'); updateSemaFlags('ALPHA'); await new Promise(r => semaTimer = setTimeout(r, speed * 1.5)); } 
                    updateSemaFlags(char); await new Promise(r => semaTimer = setTimeout(r, speed)); 
                }
                lastChar = char;
            }
            if(isSemaPlaying) {
                updateSemaFlags('ATT', false);
                document.getElementById('arm-left-screen').classList.add('animate-wave-l');
                document.getElementById('arm-right-screen').classList.add('animate-wave-r');
                await new Promise(r => semaTimer = setTimeout(r, 2000));
                document.getElementById('arm-left-screen').classList.remove('animate-wave-l');
                document.getElementById('arm-right-screen').classList.remove('animate-wave-r');
            }
            modeTag.classList.add('hidden'); stopSemaphore();
        }
        function stopSemaphore() { isSemaPlaying = false; clearTimeout(semaTimer); updateSemaFlags('REST'); document.getElementById('btn-play-sema').disabled = false; }
        
        function updateSemaFlags(key, showText = true, overrideText = null) {
            const angles = semaphoreData[key] || [0, 0];
            document.getElementById('arm-left-screen').style.transform = `rotate(${angles[0]}deg)`;
            document.getElementById('arm-right-screen').style.transform = `rotate(${angles[1]}deg)`;
            const overlay = document.getElementById('sema-char-overlay');
            if (!showText || ['REST',' ','ATT','NUM','ALPHA'].includes(key)) overlay.innerText = '';
            else overlay.innerText = practiceActive.semaphore ? '?' : (overrideText || key);
        }

        function switchTab(tab) {
            ['morse', 'semaphore', 'ref'].forEach(t => { document.getElementById(`section-${t}`).classList.add('hidden'); document.getElementById(`tab-${t}`).classList.remove('btn-active'); });
            document.getElementById(`section-${tab}`).classList.remove('hidden'); document.getElementById(`tab-${tab}`).classList.add('btn-active');
            stopMorse(); stopSemaphore();
        }
        function switchRefTab(sub) {
            ['morse', 'semaphore'].forEach(s => { document.getElementById(`ref-${s}`).classList.add('hidden'); document.getElementById(`btn-ref-${s}`).classList.remove('ref-tab-active'); });
            document.getElementById(`ref-${sub}`).classList.remove('hidden'); document.getElementById(`btn-ref-${sub}`).classList.add('ref-tab-active');
        }
        let practiceActive = { morse: false, semaphore: false };
        function togglePractice(mode) { 
            const m = (mode === 'morse') ? 'morse' : 'semaphore';
            practiceActive[m] = !practiceActive[m]; 
            const modeId = (mode === 'morse') ? 'morse' : 'sema';
            const btn = document.getElementById(`practice-btn-${modeId}`); 
            const answerBox = document.getElementById(`${modeId}-answer-box`); 
            const showAnsBtn = document.getElementById(`show-ans-${modeId}`); 
            if (practiceActive[m]) { 
                btn.classList.add('bg-orange-600', 'text-white'); answerBox.classList.remove('hidden'); if(showAnsBtn) showAnsBtn.classList.remove('hidden'); generateAIContent(mode); 
            } else { 
                btn.classList.remove('bg-orange-600', 'text-white'); answerBox.classList.add('hidden'); if(showAnsBtn) showAnsBtn.classList.add('hidden'); 
            } 
        }
        function revealAnswer(mode) { document.getElementById(`${mode}-answer-box`).classList.add('hidden'); }

        window.onload = () => { 
            switchTab('morse'); 
            updateSemaFlags('REST'); 
            document.body.addEventListener('click', initAudio, {once: true}); 
        };
        document.getElementById('morse-wpm').addEventListener('input', (e) => document.getElementById('wpm-display').innerText = e.target.value);
        document.getElementById('sema-speed').addEventListener('input', (e) => document.getElementById('sema-speed-display').innerText = e.target.value);
    </script>
